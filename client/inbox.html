<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFUS - Virtual Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-brand">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 16px;">
          <h1 class="brand-name" style="margin:0;">DFUS</h1>
        </a>
      </div>
    </header>

    <main class="app-main">
      <!-- AUTH PANEL -->
      <section class="card upload-card" id="auth-panel">
        <h2 class="card-title">Virtual Inbox Access</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">Login to your secure DFUS Inbox or create a new one to receive files.</p>
        
        <p id="auth-status" style="text-align: center; font-size: 0.9rem; margin-bottom: 16px; font-weight: 500;"></p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
          <!-- Login -->
          <div style="background: var(--bg-surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color);">
            <h3 style="color: var(--primary); margin-bottom: 16px; font-size: 1.1rem;">Login</h3>
            <div style="margin-bottom: 12px;">
              <label class="info-label">Inbox ID</label>
              <input type="text" id="login-id" class="input-field" placeholder="e.g. drop@dfus.com">
            </div>
            <div style="margin-bottom: 12px;">
              <label class="info-label">Password</label>
              <input type="password" id="login-pass" class="input-field" placeholder="••••••••">
            </div>
            <button id="btn-login-inbox" class="btn btn-primary" style="width: 100%;">Access Inbox</button>
          </div>

          <!-- Create -->
          <div style="background: var(--bg-surface); padding: 16px; border-radius: 8px; border: 1px solid var(--border-color);">
            <h3 style="color: #a78bfa; margin-bottom: 16px; font-size: 1.1rem;">Create Inbox</h3>
            <div style="margin-bottom: 12px;">
              <label class="info-label">Desired Inbox ID</label>
              <input type="text" id="create-id" class="input-field" placeholder="e.g. myname@dfus.com">
            </div>
            <div style="margin-bottom: 12px;">
              <label class="info-label">Set Password</label>
              <input type="password" id="create-pass" class="input-field" placeholder="••••••••">
            </div>
            <button id="btn-create-inbox" class="btn btn-secondary" style="width: 100%; border-color: #a78bfa; color: #a78bfa;">Register Inbox</button>
          </div>
        </div>
      </section>

      <!-- DASHBOARD PANEL -->
      <section class="card analytics-panel" id="dashboard-panel" style="display: none; max-width: 900px;">
        <div class="card-header">
          <h2 class="card-title" id="inbox-title">My Inbox</h2>
        </div>
        <div class="table-responsive">
          <table class="analytics-table">
            <thead>
              <tr>
                <th>Date Received</th>
                <th>File Name</th>
                <th>Size</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="inbox-table-body">
              <!-- Dynamically populated via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Global Footer -->
    <footer class="app-footer">
      <div class="footer-links">
        <a href="changelog.html" class="footer-link">Changelog</a>
        <span class="separator">•</span>
        <a href="#" class="footer-link">Terms</a>
        <span class="separator">•</span>
        <a href="#" class="footer-link">Privacy</a>
        <span class="separator">•</span>
        <a href="https://github.com/cat-sandwich-official/dfus" class="footer-link">GitHub</a>
      </div>
      <div class="footer-copyright">© 2026 DFUS. All rights reserved.</div>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="inbox.js"></script>
</body>
</html>

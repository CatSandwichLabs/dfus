<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFUS - Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    
    <!-- FirebaseUI -->
    <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <div class="auth-header">
                <h2>System Access</h2>
                <p>Distributed File Upload System</p>
            </div>
            
            <div id="firebase-message" class="error-message" style="margin-bottom: 1rem;">
                <!-- Configure Firebase Below -->
            </div>

            <!-- FirebaseUI Auth Container -->
            <div id="firebaseui-auth-container"></div>
            
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID"
        };
        
        try {
            firebase.initializeApp(firebaseConfig);
            
            const ui = new firebaseui.auth.AuthUI(firebase.auth());
            
            const uiConfig = {
                callbacks: {
                    signInSuccessWithAuthResult: function(authResult, redirectUrl) {
                        // Firebase handles the tokens.
                        // We extract the ID token and send it to our backend to get our user object.
                        authResult.user.getIdToken().then(token => {
                            // Save token to localStorage for api.js to use
                            localStorage.setItem('dfus_token', token);
                            
                            // Hit backend /me to provision user
                            api.get('/auth/me').then(res => {
                                localStorage.setItem('dfus_user', JSON.stringify(res.user));
                                window.location.href = 'dashboard.html';
                            }).catch(err => {
                                document.getElementById('firebase-message').innerText = "Backend provisioning failed: " + err.message;
                            });
                        });
                        return false; // Prevent auto-redirect
                    }
                },
                signInFlow: 'popup',
                signInOptions: [
                    firebase.auth.EmailAuthProvider.PROVIDER_ID,
                    firebase.auth.GoogleAuthProvider.PROVIDER_ID
                ]
            };
            
            ui.start('#firebaseui-auth-container', uiConfig);
            
        } catch (err) {
            document.getElementById('firebase-message').innerText = "Please update firebaseConfig in index.html with your Firebase credentials.";
            document.getElementById('firebaseui-auth-container').style.display = 'none';
        }
    </script>
</body>
</html>
